<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Tracker — TechForDad Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --navy:#1B3A6B; --navy-dark:#162f58;
    --bg:#f1f5f9; --surface:#fff; --border:#e2e8f0; --border-dk:#cbd5e1;
    --ink:#0f172a; --muted:#64748b; --muted-dk:#475569;
    --good:#16a34a; --good-bg:#dcfce7;
    --warn:#d97706; --warn-bg:#fef3c7;
    --bad:#dc2626; --bad-bg:#fee2e2;
    --model:#7c3aed; --model-bg:#ede9fe;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;min-height:100vh}
  .topbar{background:#0f172a;color:#fff;height:56px;display:flex;align-items:center;padding:0 24px;gap:12px;position:sticky;top:0;z-index:50}
  .topbar .logo{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .topbar .logo .star{color:#fbbf24}
  .topbar .crumb{color:#94a3b8;font-size:13px}
  .topbar .spacer{flex:1}
  .topbar .back{color:#cbd5e1;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:6px}
  .topbar .back:hover{background:#1e293b;color:#fff}

  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}

  header.page{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  header.page h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.01em}
  header.page .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .export-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
  .export-btn:hover{background:var(--navy-dark)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
  .stat:hover{border-color:var(--border-dk)}
  .stat.active{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
  .stat .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .stat .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-top:5px;font-weight:600}
  .stat.s-current .n{color:var(--good)}
  .stat.s-unverifiable .n{color:var(--bad)}
  .stat.s-needs .n{color:var(--warn)}
  .stat.s-check .n{color:var(--model)}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
  .controls input[type=search]{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
  .controls select{font:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}
  .controls .count{color:var(--muted);font-size:12.5px;white-space:nowrap;margin-left:auto}
  .clear-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--muted-dk);cursor:pointer;font-weight:600}
  .clear-btn:hover{background:#f1f5f9}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .table-wrap{overflow:auto;max-height:calc(100vh - 230px)}
  table{width:100%;border-collapse:collapse;min-width:900px}
  thead th{position:sticky;top:0;z-index:2;background:#f8fafc;text-align:left;padding:10px 14px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
  thead th:hover{color:var(--ink)}
  thead th .arrow{opacity:.35;margin-left:3px;font-size:10px}
  thead th.sorted .arrow{opacity:1;color:var(--navy)}
  tbody td{padding:10px 14px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafbfc}
  .name{font-weight:600}
  .note{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4;max-width:360px}
  .cat{color:var(--muted-dk);font-size:12.5px;white-space:nowrap}
  .price{font-variant-numeric:tabular-nums;white-space:normal;max-width:260px;font-size:13px}
  .pages{color:var(--muted);font-size:11.5px;margin-top:3px;font-family:ui-monospace,monospace}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill.Current{color:var(--good);background:var(--good-bg)}
  .pill.Unverifiable{color:var(--bad);background:var(--bad-bg)}
  .pill.Needs_2nd_source{color:var(--warn);background:var(--warn-bg)}
  .pill.Check_model{color:var(--model);background:var(--model-bg)}
  .verified{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px}
  .verified.stale{color:var(--bad);font-weight:600}
  .noindex-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--muted-dk);background:#f1f5f9;border:1px solid var(--border-dk);padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.03em}
  .carrier-tag{display:inline-block;font-size:10.5px;font-weight:700;color:#0369a1;background:#e0f2fe;border:1px solid #7dd3fc;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:middle;text-transform:uppercase;letter-spacing:.03em}
  .src a{color:var(--navy);text-decoration:none;font-size:12.5px;font-weight:600}
  .src a:hover{text-decoration:underline}
  .src span{color:#cbd5e1;font-size:12.5px}
  .empty{text-align:center;padding:48px 20px;color:var(--muted)}

  @media (max-width: 760px){
    .cat, thead th:nth-child(2), thead th:nth-child(3){display:none}
    .note,.price{max-width:220px}
    .table-wrap{max-height:calc(100vh - 320px)}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><span class="star">★</span> TechForDad Admin</div>
  <div class="crumb">/ Product Tracker</div>
  <div class="spacer"></div>
  <a class="back" href="index.html">← Back to admin</a>
</div>

<div class="wrap">
  <header class="page">
    <div>
      <h1>Product Tracker</h1>
      <div class="sub" id="sub-line">Prices and sources the site relies on, checked against manufacturer and store pages. Internal use only — not published.</div>
    </div>
    <button class="export-btn" id="export-btn">Export CSV</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input type="search" id="search" placeholder="Search product, category, or source&hellip;">
    <select id="catFilter"><option value="">All categories</option></select>
    <select id="countryFilter">
      <option value="">All countries</option>
      <option value="US">US</option>
      <option value="CA">Canada</option>
      <option value="US/CA">US/CA (both)</option>
    </select>
    <select id="noindexFilter">
      <option value="">All pages</option>
      <option value="noindex">Noindex pages only</option>
      <option value="indexed">Indexed pages only</option>
    </select>
    <button class="clear-btn" id="clear-btn" title="Clear all filters">Clear filters</button>
    <span class="count" id="count"></span>
  </div>

  <div class="panel">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="name">Product <span class="arrow">↕</span></th>
            <th data-sort="category">Category <span class="arrow">↕</span></th>
            <th data-sort="country">Country <span class="arrow">↕</span></th>
            <th data-sort="price">Price <span class="arrow">↕</span></th>
            <th data-sort="status">Status <span class="arrow">↕</span></th>
            <th data-sort="verified">Verified <span class="arrow">↕</span></th>
            <th>Source</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="7" class="empty">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  var allRows = [];
  var activeStatus = '';
  var sortField = 'name';
  var sortDir = 1;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function daysAgo(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return null;
    return Math.round((Date.now() - d.getTime()) / 86400000);
  }

  function statusClass(s) { return (s || '').replace(/ /g, '_'); }

  function render() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var cat = document.getElementById('catFilter').value;
    var country = document.getElementById('countryFilter').value;
    var noindex = document.getElementById('noindexFilter').value;

    var filtered = allRows.filter(function (r) {
      if (activeStatus && r.status !== activeStatus) return false;
      if (cat && r.category !== cat) return false;
      if (country && r.country !== country) return false;
      if (noindex === 'noindex' && !r.noindex) return false;
      if (noindex === 'indexed' && r.noindex) return false;
      if (q) {
        var hay = (r.name + ' ' + r.category + ' ' + (r.note || '') + ' ' + (r.source_url || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    filtered.sort(function (a, b) {
      var av = a[sortField] || '', bv = b[sortField] || '';
      return av < bv ? -1 * sortDir : av > bv ? 1 * sortDir : 0;
    });

    document.querySelectorAll('thead th[data-sort]').forEach(function (th) {
      th.classList.toggle('sorted', th.dataset.sort === sortField);
      var arrow = th.querySelector('.arrow');
      if (th.dataset.sort === sortField) arrow.textContent = sortDir === 1 ? '↑' : '↓';
      else arrow.textContent = '↕';
    });

    var tbody = document.getElementById('rows');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">No products match.</td></tr>';
    } else {
      tbody.innerHTML = filtered.map(function (r) {
        var pillClass = statusClass(r.status);
        var src = r.source_url
          ? '<a href="' + esc(r.source_url) + '" target="_blank" rel="noopener">source ↗</a>'
          : '<span>&mdash;</span>';
        var note = r.note ? '<div class="note">' + esc(r.note) + '</div>' : '';
        var pages = (r.pages && r.pages.length) ? '<div class="pages">' + r.pages.map(esc).join('<br>') + '</div>' : '';
        var age = daysAgo(r.verified);
        var staleClass = (age !== null && age > 30) ? ' stale' : '';
        var noindexTag = r.noindex ? '<span class="noindex-tag" title="This product\'s page is noindex on the live site">noindex</span>' : '';
        var carrierTag = r.carrier ? '<span class="carrier-tag" title="Carrier-bundled hardware, not a standalone retail product -- no Amazon equivalent exists">carrier</span>' : '';
        return '<tr>' +
          '<td><div class="name">' + esc(r.name) + '</div>' + note + '</td>' +
          '<td class="cat">' + esc(r.category) + '</td>' +
          '<td class="cat">' + esc(r.country || '&mdash;') + '</td>' +
          '<td class="price">' + esc(r.price || '&mdash;') + pages + '</td>' +
          '<td><span class="pill ' + pillClass + '">' + esc(r.status) + '</span>' + noindexTag + carrierTag + '</td>' +
          '<td class="verified' + staleClass + '">' + esc(r.verified || '&mdash;') + (age !== null ? ' <span style="opacity:.6">(' + age + 'd)</span>' : '') + '</td>' +
          '<td class="src">' + src + '</td>' +
          '</tr>';
      }).join('');
    }

    document.getElementById('count').textContent = filtered.length + ' of ' + allRows.length + ' products';
    renderStats();
  }

  function renderStats() {
    var total = allRows.length;
    var current = allRows.filter(function (r) { return r.status === 'Current'; }).length;
    var unverifiable = allRows.filter(function (r) { return r.status === 'Unverifiable'; }).length;
    var needs = allRows.filter(function (r) { return r.status === 'Needs 2nd source'; }).length;
    var checkModel = allRows.filter(function (r) { return r.status === 'Check model'; }).length;

    var defs = [
      { key: '', label: 'All products', n: total, cls: '' },
      { key: 'Current', label: 'Current', n: current, cls: 's-current' },
      { key: 'Unverifiable', label: 'Unverifiable', n: unverifiable, cls: 's-unverifiable' },
      { key: 'Needs 2nd source', label: 'Needs 2nd source', n: needs, cls: 's-needs' },
      { key: 'Check model', label: 'Check model', n: checkModel, cls: 's-check' }
    ];

    document.getElementById('stats').innerHTML = defs.map(function (d) {
      return '<div class="stat ' + d.cls + (activeStatus === d.key ? ' active' : '') + '" data-status="' + esc(d.key) + '">' +
        '<div class="n">' + d.n + '</div><div class="l">' + esc(d.label) + '</div></div>';
    }).join('');

    document.querySelectorAll('.stat').forEach(function (el) {
      el.addEventListener('click', function () {
        activeStatus = (activeStatus === el.dataset.status) ? '' : el.dataset.status;
        render();
      });
    });
  }

  function populateCategoryFilter() {
    var cats = Array.from(new Set(allRows.map(function (r) { return r.category; }))).sort();
    var sel = document.getElementById('catFilter');
    cats.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  }

  function toCsv(rows) {
    var cols = ['name', 'category', 'price', 'status', 'verified', 'source_url', 'note'];
    var lines = [cols.join(',')];
    rows.forEach(function (r) {
      lines.push(cols.map(function (c) {
        var v = String(r[c] == null ? '' : r[c]).replace(/"/g, '""');
        return '"' + v + '"';
      }).join(','));
    });
    return lines.join('\n');
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('catFilter').addEventListener('change', render);
  document.getElementById('countryFilter').addEventListener('change', render);
  document.getElementById('noindexFilter').addEventListener('change', render);
  document.getElementById('clear-btn').addEventListener('click', function () {
    document.getElementById('search').value = '';
    document.getElementById('catFilter').value = '';
    document.getElementById('countryFilter').value = '';
    document.getElementById('noindexFilter').value = '';
    activeStatus = '';
    render();
  });
  document.querySelectorAll('thead th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var field = th.dataset.sort;
      if (sortField === field) sortDir *= -1;
      else { sortField = field; sortDir = 1; }
      render();
    });
  });
  document.getElementById('export-btn').addEventListener('click', function () {
    var blob = new Blob([toCsv(allRows)], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'techfordad-product-tracker.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  fetch('product-tracker-data.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      allRows = data.products || [];
      document.getElementById('sub-line').textContent =
        'Prices and sources the site relies on, checked against manufacturer and store pages. Exported from the claude.ai Product Tracker on ' + (data.exported || '?') + '. Internal use only — not published.';
      populateCategoryFilter();
      render();
    })
    .catch(function (e) {
      document.getElementById('rows').innerHTML =
        '<tr><td colspan="7" class="empty">Could not load product-tracker-data.json — ' + esc(e.message) + '. Run this from a local server (see admin/README.md), not by opening the file directly.</td></tr>';
    });
})();
</script>

</body>
</html>
