name: Weekly SEO Report

on:
  schedule:
    - cron: '0 8 * * 0'   # Every Sunday at 8am UTC
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

jobs:
  create-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Generate report
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: 'sc-domain:techfordad.com'
        run: python3 scripts/generate_seo_report.py > /tmp/issue_body.md

      - name: Ensure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "seo-report" --color "0E8A16" \
            --description "Automated weekly SEO report" || true

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Weekly SEO Report — $(date +'%Y-%m-%d')"
          gh issue create \
            --title "$TITLE" \
            --body-file /tmp/issue_body.md \
            --label "seo-report" \
            --assignee "abhikarmaker"
