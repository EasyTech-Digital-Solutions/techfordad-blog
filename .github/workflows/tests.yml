name: Tests

# Runs the whole suite (tests/) on every pull request and on every push to main.
# A red check means something on the site is broken, insecure, or not covered by the tests: open the run and read
# the failing test's message; each one says what to fix. See tests/README.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to exact commits (tag shown in the comment); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies and the browser
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run the test suite
        run: python -m pytest -q -p no:cacheprovider
