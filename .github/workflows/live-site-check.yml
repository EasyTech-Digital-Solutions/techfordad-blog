name: Live site check

# Once a week (and on demand) checks the PUBLISHED site: every sitemap URL is up, the certificate is not about to
# expire, security headers are still present, and no internal file is publicly reachable. A failure emails the
# repo owner through GitHub's normal workflow-failure notification. See tests/test_live_site.py.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: pip install -r tests/requirements.txt

      - name: Check the live site
        run: python -m pytest tests/test_live_site.py --live -q -p no:cacheprovider
